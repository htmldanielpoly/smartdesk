# CI/CD for SmartDesk.
#
#   lint-test    — ruff + pytest for each service in parallel (matrix).
#   docker-smoke — builds the real images, boots the full stack with
#                  docker compose and runs the end-to-end smoke test through
#                  the public gateway (local AI disabled for CI speed; the
#                  AI code paths still run via their rule-based fallbacks).
#   publish      — on main only: pushes the three images to GHCR (CD).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-service, ai-service, forum-service]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements-dev.txt
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install ruff==0.8.4
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -v

  docker-smoke:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and start the full stack
        run: |
          cp .env.example .env
          LOCAL_AI_ENABLED=false docker compose up -d --build
      - name: End-to-end smoke test (through the public gateway)
        run: python scripts/smoke_test.py http://localhost:8080
      - name: Cross-service taxonomy suite (security + live system tests)
        run: |
          pip install -r api-service/requirements-dev.txt
          pytest tests/ -v
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

  publish:
    runs-on: ubuntu-latest
    needs: docker-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api-service, ai-service, forum-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}

  # CD: pull the freshly published images on the Azure VM and health-check
  # the public domain. Switched on by the repository variable DEPLOY_HOST
  # (see deploy/README.md); until it exists the job is skipped, never queued.
  deploy:
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    environment:
      name: production
      url: https://${{ vars.DEPLOY_DOMAIN }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Roll the VM to this commit's images
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GITHUB_SHA
          script_stop: true
          script: |
            cd /opt/smartdesk
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${GITHUB_SHA}/" .env
            grep -q '^IMAGE_TAG=' .env || echo "IMAGE_TAG=${GITHUB_SHA}" >> .env
            docker compose --env-file .env -f docker-compose.prod.yml pull --quiet
            docker compose --env-file .env -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f >/dev/null
      - name: Health check the public URL
        run: |
          for i in $(seq 1 24); do
            if curl -fsS "https://${{ vars.DEPLOY_DOMAIN }}/health" | grep -q '"ok"'; then
              echo "deployed ${GITHUB_SHA} is live"; exit 0
            fi
            sleep 5
          done
          echo "site did not become healthy"; exit 1

  # Optional: deploy to a teammate's Docker Desktop through a self-hosted
  # runner (demo setups). Set the repository variable DEPLOY_SELF_HOSTED=true.
  deploy-self-hosted:
    runs-on: self-hosted
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_SELF_HOSTED == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and restart the local stack
        shell: bash
        run: |
          [ -f .env ] || cp .env.example .env
          docker compose down
          docker compose up -d --build
