# CI/CD for SmartDesk.
#
#   lint-test    — ruff + pytest for each service in parallel (matrix).
#   docker-smoke — builds the real images, boots the full stack with
#                  docker compose and runs the end-to-end smoke test through
#                  the public gateway (local AI disabled for CI speed; the
#                  AI code paths still run via their rule-based fallbacks).
#   publish      — on main only: pushes the three images to GHCR (CD).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-service, ai-service, forum-service]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements-dev.txt
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install ruff==0.8.4
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -v

  docker-smoke:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the full stack
        run: |
          cp .env.example .env
          LOCAL_AI_ENABLED=false docker compose up -d --build
      - name: End-to-end smoke test (through the public gateway)
        run: python scripts/smoke_test.py http://localhost:8080
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

  publish:
    runs-on: ubuntu-latest
    needs: docker-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api-service, ai-service, forum-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
