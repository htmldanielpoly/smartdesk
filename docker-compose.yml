services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - smartdesk
    # Internal only — not published to the host.

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    environment:
      LOCAL_AI_ENABLED: ${LOCAL_AI_ENABLED:-true}
      MODELS_DIR: /models
      AUTO_DOWNLOAD_MODELS: ${AUTO_DOWNLOAD_MODELS:-true}
    volumes:
      # Model files (~450 MB) are downloaded on first start and persist here,
      # so container rebuilds never re-download them.
      - ai_models:/models
    networks:
      - smartdesk
    # Internal only — reachable from api-service at http://ai-service:8000.

  forum-service:
    build: ./forum-service
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: smartdesk_forum
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}   # must match api-service
    networks:
      - smartdesk
    # Internal only — reachable from api-service at http://forum-service:8001.

  api-service:
    build: ./api-service
    restart: unless-stopped
    depends_on:
      - mongo
      - ai-service
      - forum-service
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: smartdesk
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      AI_SERVICE_URL: http://ai-service:8000
      FORUM_SERVICE_URL: http://forum-service:8001
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Per-IP request cap. Raise it when seeding the grid demo or load testing
      # (many requests from one host); default is fine for normal use.
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-30}
    ports:
      - "8080:8080"   # The only service exposed to clients.
    networks:
      - smartdesk

networks:
  smartdesk:
    driver: bridge

volumes:
  mongo_data:
  ai_models:
