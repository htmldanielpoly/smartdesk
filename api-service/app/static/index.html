<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SmartDesk</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f7a8c'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3ES%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <!-- Auth screen -->
  <div id="auth" class="auth-wrap">
    <div class="auth-card">
      <div class="brand"><span class="logo">S</span> SmartDesk</div>
      <p class="auth-sub">AI-powered support, running locally.</p>

      <form id="login-form">
        <label class="field"><span>Email</span>
          <input type="email" id="login-email" autocomplete="username" required /></label>
        <label class="field"><span>Password</span>
          <input type="password" id="login-password" autocomplete="current-password" required /></label>
        <button class="btn block" type="submit">Sign in</button>
        <div class="err-text" id="login-err"></div>
        <p class="auth-toggle">New here? <a id="show-register">Create an account</a></p>
      </form>

      <form id="register-form" style="display:none">
        <label class="field"><span>Full name</span>
          <input type="text" id="reg-name" required /></label>
        <label class="field"><span>Email</span>
          <input type="email" id="reg-email" autocomplete="username" required /></label>
        <label class="field"><span>Password <small class="muted">(min 8 chars)</small></span>
          <input type="password" id="reg-password" autocomplete="new-password" minlength="8" required /></label>
        <button class="btn block" type="submit">Create account</button>
        <div class="err-text" id="reg-err"></div>
        <p class="auth-toggle">Already have an account? <a id="show-login">Sign in</a></p>
      </form>
    </div>
  </div>

  <!-- App shell -->
  <div id="app" class="app">
    <aside class="sidebar">
      <div class="brand"><span class="logo">S</span> SmartDesk</div>
      <nav id="nav"></nav>
      <div class="nav-spacer"></div>
      <button class="nav-item" id="logout-btn"><span class="ico">⎋</span> Sign out</button>
      <div class="nav-foot">SmartDesk · local AI</div>
    </aside>
    <div class="main">
      <header class="topbar">
        <h1 id="page-title">Tickets</h1>
        <div class="user-chip">
          <div class="user-meta">
            <div id="user-name">—</div>
            <div class="role" id="user-role">—</div>
          </div>
          <div class="avatar" id="user-avatar">?</div>
        </div>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>

  <div id="toast"></div>
  <script src="/static/app.js"></script>
</body>
</html>
